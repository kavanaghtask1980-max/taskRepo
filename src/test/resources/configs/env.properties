# Environment & Execution Flags
env=prod
grid_run=N
headless=N

# Login Page
login_username_id = j_username
login_password_id = j_password
login_submit_css = button.jenkins-button--primary

# Dashboard Page
dashboard_newItem_css = span.task-icon-link
dashboard_manageJenkins_css = a[href='/manage']
dashboard_searchBtn_id = root-action-SearchAction
dashboard_searchInput_css = input[type='search']
dashboard_contextMenu_css = div.jenkins-dropdown

# New Item & Job Configuration Page
newItem_nameInput_css = input#name
newItem_freestyleCard_xpath = //span[text()='Freestyle project']
newItem_okBtn_id = ok-button
job_description_name = description
job_saveBtn_css = button[name='Submit']
job_deleteLink_css = a[data-url$='/doDelete']
job_confirmDeleteBtn_css = dialog button.jenkins-button--primary